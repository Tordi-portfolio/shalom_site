{% extends "base.html" %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}

<style>
.form-page-card{
  background: var(--card);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: 2.25rem;
  max-width: 640px;
  margin: 0 auto;
}

.form-page-card h2{
  margin-bottom: 0.25rem;
}

.form-page-card h5{
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.85rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--slate);
  margin-bottom: 1.75rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--paper-line);
}

.form-page-card .btn-primary{
  padding: 0.6rem 2rem;
}

.form-page-card .btn-secondary{
  padding: 0.6rem 1.5rem;
  margin-left: 0.5rem;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid var(--paper-line);
  color: var(--slate);
  font-weight: 500;
}

.form-page-card .btn-secondary:hover{
  background: var(--paper);
  color: var(--ink);
}
</style>

<div class="form-page-card">

<h2>{{ title }}</h2>

<h5>{{ subject.title }}</h5>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-primary">

Save Question

</button>

<a href="{% url 'question_list' subject.id %}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

{% endblock %}
